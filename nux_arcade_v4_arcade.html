$('#brickAction').onclick=()=>{if(!brick)return;scrollBrickForPlay();if(!brick.running&&$('#brickOverlay').classList.contains('hidden'))beginBrickGame();brickAction()};$('#brickPause').onclick=()=>brick&&brick.running?pauseBrickGame():beginBrickGame();$('#brickRestart').onclick=()=>{if(!brick)return;prepareBrick(brick.stage,false);beginBrickGame()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&brick&&brick.running)pauseBrickGame(true)});
