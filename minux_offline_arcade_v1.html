<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101629">
  <title>미눅스 오프라인 오락실</title>
  <style>
    :root{--bg:#0b1020;--card:#151d34;--card2:#1c2744;--text:#f7f8ff;--muted:#aeb8d4;--accent:#7c5cff;--accent2:#24d2b2;--danger:#ff647c;--line:#2b385d;--shadow:0 14px 36px #0007}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0,#202b52 0,#0b1020 38%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overscroll-behavior:none}
    body{min-height:100dvh}.app{width:min(100%,720px);margin:auto;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand h1{font-size:22px;margin:0}.brand p{color:var(--muted);font-size:12px;margin:4px 0 0}.top-actions{display:flex;gap:8px}
    button{font:inherit;color:inherit;border:0;cursor:pointer}.icon-btn,.small-btn{background:#202b49;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.icon-btn{width:44px;height:44px;padding:0;font-size:20px}.hidden{display:none!important}
    .hero{padding:21px;background:linear-gradient(135deg,#7658ff,#4a38c4 52%,#235a8d);border-radius:24px;box-shadow:var(--shadow);margin-bottom:16px}.hero .eyebrow{font-size:12px;opacity:.8}.hero h2{font-size:26px;line-height:1.25;margin:8px 0}.hero p{margin:0;opacity:.86;font-size:14px;line-height:1.55}
    .games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.game-card{text-align:left;background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:17px;min-height:164px;box-shadow:0 7px 22px #0004;position:relative;overflow:hidden}.game-card:active{transform:scale(.98)}.game-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#ffffff12;font-size:31px;margin-bottom:18px}.game-card h3{font-size:18px;margin:0 0 5px}.game-card p{font-size:12px;color:var(--muted);margin:0}.badge{position:absolute;right:12px;top:12px;background:#ffffff18;border:1px solid #ffffff18;border-radius:99px;padding:5px 8px;font-size:10px}
    .footer-note{color:#7f8bab;text-align:center;font-size:11px;line-height:1.6;margin:18px 12px}.screen-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.screen-title h2{font-size:20px;margin:0}.panel{background:#111a30;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow)}
    .score-row{display:flex;gap:9px;align-items:stretch;margin-bottom:12px}.score-box{flex:1;background:#202b49;border-radius:14px;padding:8px;text-align:center}.score-box span{display:block;color:var(--muted);font-size:10px}.score-box strong{font-size:20px}.new-btn{background:var(--accent);border-radius:14px;padding:0 14px;font-weight:800}
    #board2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#273451;padding:8px;border-radius:17px;touch-action:none;aspect-ratio:1}.tile{display:grid;place-items:center;border-radius:11px;background:#17213a;font-weight:900;font-size:clamp(22px,8vw,39px);transition:.12s}.v2{background:#e8e2d6;color:#40404d}.v4{background:#e7d5b6;color:#40404d}.v8{background:#f3a55f}.v16{background:#f17c54}.v32{background:#ec5e59}.v64{background:#dd3f45}.v128{background:#e5bd4d;font-size:clamp(18px,7vw,32px)}.v256{background:#dcae2f;font-size:clamp(18px,7vw,32px)}.v512{background:#c89916;font-size:clamp(18px,7vw,32px)}.v1024,.v2048{background:#7c5cff;font-size:clamp(15px,6vw,28px)}.vx{background:#24d2b2;font-size:clamp(14px,5vw,25px)}
    .pad{width:190px;margin:16px auto 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pad button{height:48px;border-radius:12px;background:#202b49;border:1px solid var(--line);font-size:19px}.pad .up{grid-column:2}.pad .left{grid-column:1}.help{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 0}
    .flag-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.progress{font-size:13px;color:var(--muted)}.streak{background:#25304c;padding:7px 10px;border-radius:99px;font-size:12px}.flag-card{text-align:center;background:#f7f8ff;color:#101425;border-radius:20px;padding:20px 12px 17px;min-height:205px;display:flex;flex-direction:column;justify-content:center}.flag{font-size:86px;line-height:1.1;filter:drop-shadow(0 5px 5px #0002)}.question{font-size:15px;font-weight:800;margin-top:12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.choice{min-height:56px;background:#202b49;border:1px solid var(--line);border-radius:14px;padding:8px;font-weight:750}.choice.correct{background:#17785f;border-color:#24d2b2}.choice.wrong{background:#863448;border-color:#ff647c}.feedback{height:32px;text-align:center;font-weight:800;padding-top:9px}.flag-actions{display:flex;justify-content:center;gap:8px;margin-top:10px}.result{text-align:center;padding:24px 12px}.result .big{font-size:48px}.result h3{font-size:24px;margin:8px}.result p{color:var(--muted);line-height:1.6}.primary{background:var(--accent);padding:13px 20px;border-radius:14px;font-weight:800}
    .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#050816e8;border:1px solid #34415f;border-radius:13px;padding:10px 15px;font-size:12px;z-index:5;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
    @media(max-width:390px){.app{padding-left:12px;padding-right:12px}.game-card{min-height:154px;padding:14px}.hero h2{font-size:23px}.flag{font-size:74px}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><h1>✈️ 미눅스 오락실</h1><p>인터넷 없이 즐기는 기내 게임</p></div><div class="top-actions"><button class="icon-btn" id="soundBtn" aria-label="효과음">🔇</button><button class="icon-btn hidden" id="homeBtn" aria-label="홈">⌂</button></div></header>
  <section id="homeScreen">
    <div class="hero"><div class="eyebrow">OFFLINE ARCADE · VERSION 1</div><h2>긴 비행도<br>조금은 짧게.</h2><p>모든 게임과 데이터가 이 파일 하나에 들어 있습니다.<br>비행기 모드에서도 그대로 즐겨보세요.</p></div>
    <div class="games">
      <button class="game-card" data-game="2048"><span class="badge">혼자</span><div class="game-icon">🔢</div><h3>2048</h3><p>숫자를 합쳐 최고 기록에 도전</p></button>
      <button class="game-card" data-game="flags"><span class="badge">50개국</span><div class="game-icon">🌍</div><h3>세계 국기 퀴즈</h3><p>국기를 보고 나라 이름 맞히기</p></button>
    </div>
    <p class="footer-note">진행 상황과 최고 기록은 이 기기에 자동 저장됩니다.<br>국기는 휴대폰의 기본 컬러 이모지로 표시됩니다.</p>
  </section>
  <section id="game2048" class="hidden">
    <div class="screen-title"><h2>2048</h2><span class="progress">같은 숫자를 합치세요</span></div>
    <div class="panel"><div class="score-row"><div class="score-box"><span>점수</span><strong id="score2048">0</strong></div><div class="score-box"><span>최고</span><strong id="best2048">0</strong></div><button class="new-btn" id="new2048">새 게임</button></div><div id="board2048"></div><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><p class="help">화면을 밀거나 방향 버튼을 눌러 움직이세요.</p></div>
  </section>
  <section id="flagGame" class="hidden">
    <div class="screen-title"><h2>세계 국기 퀴즈</h2><button class="small-btn" id="restartFlags">처음부터</button></div>
    <div class="panel" id="flagPlay"><div class="flag-top"><span class="progress" id="flagProgress">1 / 10</span><span class="streak" id="flagScore">점수 0</span></div><div class="flag-card"><div class="flag" id="flagEmoji">🇰🇷</div><div class="question">이 국기는 어느 나라일까요?</div></div><div class="choices" id="flagChoices"></div><div class="feedback" id="flagFeedback"></div><div class="flag-actions"><button class="small-btn" id="nextFlag" disabled>다음 문제</button></div></div>
    <div class="panel result hidden" id="flagResult"><div class="big">🏆</div><h3 id="resultTitle">훌륭해요!</h3><p id="resultText"></p><button class="primary" id="againFlags">다시 도전</button></div>
  </section>
</main><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let sound=localStorage.arcadeSound==='on';
function beep(freq=520,d=.06){if(!sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);setTimeout(()=>c.close(),200)}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}
function setSound(){sound=!sound;localStorage.arcadeSound=sound?'on':'off';$('#soundBtn').textContent=sound?'🔊':'🔇';beep()}
$('#soundBtn').textContent=sound?'🔊':'🔇';$('#soundBtn').onclick=setSound;
function show(id){['#homeScreen','#game2048','#flagGame'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('#homeBtn').classList.toggle('hidden',id==='#homeScreen');scrollTo(0,0)}
$('#homeBtn').onclick=()=>show('#homeScreen');$$('.game-card').forEach(b=>b.onclick=()=>{show(b.dataset.game==='2048'?'#game2048':'#flagGame');if(b.dataset.game==='flags'&&!flagState)startFlags()});

// 2048
let grid=JSON.parse(localStorage.grid2048||'null')||Array(16).fill(0),score=+(localStorage.score2048||0),best=+(localStorage.best2048||0);
function empty(){return grid.map((v,i)=>v?null:i).filter(v=>v!==null)}
function addTile(){const a=empty();if(!a.length)return;const i=a[Math.floor(Math.random()*a.length)];grid[i]=Math.random()<.9?2:4}
if(grid.every(v=>!v)){addTile();addTile()}
function render2048(){const b=$('#board2048');b.innerHTML='';grid.forEach(v=>{const d=document.createElement('div');d.className='tile '+(v?(v<=2048?'v'+v:'vx'):'');d.textContent=v||'';b.appendChild(d)});$('#score2048').textContent=score;$('#best2048').textContent=best;localStorage.grid2048=JSON.stringify(grid);localStorage.score2048=score;localStorage.best2048=best}
function slide(line){const a=line.filter(Boolean),r=[];let gain=0;for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){r.push(a[i]*2);gain+=a[i]*2;i++}else r.push(a[i])}while(r.length<4)r.push(0);return [r,gain]}
function move(dir){const old=grid.join(),n=Array(16).fill(0);let gain=0;for(let k=0;k<4;k++){let idx=[];if(dir==='left'||dir==='right')idx=[0,1,2,3].map(i=>k*4+i);else idx=[0,1,2,3].map(i=>i*4+k);if(dir==='right'||dir==='down')idx.reverse();const [vals,g]=slide(idx.map(i=>grid[i]));gain+=g;idx.forEach((p,i)=>n[p]=vals[i])}grid=n;if(grid.join()!==old){score+=gain;best=Math.max(best,score);addTile();beep(gain?650:420);render2048();if(!canMove())setTimeout(()=>toast('게임 종료! 새 게임에 도전하세요.'),120)}}
function canMove(){if(empty().length)return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){const i=r*4+c;if(c<3&&grid[i]===grid[i+1])return true;if(r<3&&grid[i]===grid[i+4])return true}return false}
$('#new2048').onclick=()=>{if(score&&!confirm('현재 게임을 지우고 새로 시작할까요?'))return;grid=Array(16).fill(0);score=0;addTile();addTile();render2048()};$$('.pad button').forEach(b=>b.onclick=()=>move(b.dataset.dir));
let sx=0,sy=0;const board=$('#board2048');board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});board.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});document.addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(m[e.key]&&!$('#game2048').classList.contains('hidden')){e.preventDefault();move(m[e.key])}});render2048();

// Flags: compact Unicode regional flags; no network or image files.
const countries=[['🇰🇷','대한민국'],['🇯🇵','일본'],['🇨🇳','중국'],['🇺🇸','미국'],['🇨🇦','캐나다'],['🇲🇽','멕시코'],['🇧🇷','브라질'],['🇦🇷','아르헨티나'],['🇨🇱','칠레'],['🇵🇪','페루'],['🇬🇧','영국'],['🇫🇷','프랑스'],['🇩🇪','독일'],['🇮🇹','이탈리아'],['🇪🇸','스페인'],['🇵🇹','포르투갈'],['🇳🇱','네덜란드'],['🇧🇪','벨기에'],['🇨🇭','스위스'],['🇦🇹','오스트리아'],['🇸🇪','스웨덴'],['🇳🇴','노르웨이'],['🇩🇰','덴마크'],['🇫🇮','핀란드'],['🇮🇸','아이슬란드'],['🇮🇪','아일랜드'],['🇵🇱','폴란드'],['🇨🇿','체코'],['🇬🇷','그리스'],['🇹🇷','튀르키예'],['🇺🇦','우크라이나'],['🇮🇳','인도'],['🇹🇭','태국'],['🇻🇳','베트남'],['🇵🇭','필리핀'],['🇮🇩','인도네시아'],['🇲🇾','말레이시아'],['🇸🇬','싱가포르'],['🇦🇺','호주'],['🇳🇿','뉴질랜드'],['🇪🇬','이집트'],['🇿🇦','남아프리카공화국'],['🇲🇦','모로코'],['🇰🇪','케냐'],['🇸🇦','사우디아라비아'],['🇦🇪','아랍에미리트'],['🇮🇱','이스라엘'],['🇷🇺','러시아'],['🇲🇳','몽골'],['🇳🇵','네팔']];
let flagState=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startFlags(){flagState={set:shuffle(countries).slice(0,10),i:0,score:0,locked:false};$('#flagPlay').classList.remove('hidden');$('#flagResult').classList.add('hidden');drawFlag()}
function drawFlag(){const s=flagState,q=s.set[s.i];s.locked=false;$('#flagProgress').textContent=`${s.i+1} / ${s.set.length}`;$('#flagScore').textContent=`점수 ${s.score}`;$('#flagEmoji').textContent=q[0];$('#flagFeedback').textContent='';$('#nextFlag').disabled=true;let wrong=shuffle(countries.filter(x=>x[1]!==q[1])).slice(0,3);const opts=shuffle([q,...wrong]);const box=$('#flagChoices');box.innerHTML='';opts.forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x[1];b.onclick=()=>answerFlag(b,x[1],q[1]);box.appendChild(b)})}
function answerFlag(btn,ans,correct){if(flagState.locked)return;flagState.locked=true;$$('.choice').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct')});if(ans===correct){flagState.score++;btn.classList.add('correct');$('#flagFeedback').textContent='정답이에요! 🎉';beep(720)}else{btn.classList.add('wrong');$('#flagFeedback').textContent=`정답은 ${correct}!`;beep(230)}$('#flagScore').textContent=`점수 ${flagState.score}`;$('#nextFlag').disabled=false}
function nextFlag(){if(!flagState.locked)return;if(++flagState.i<flagState.set.length)drawFlag();else finishFlags()}
function finishFlags(){const s=flagState,old=+(localStorage.bestFlags||0);localStorage.bestFlags=Math.max(old,s.score);$('#flagPlay').classList.add('hidden');$('#flagResult').classList.remove('hidden');$('#resultTitle').textContent=s.score===10?'완벽해요!':s.score>=7?'훌륭해요!':s.score>=4?'좋은 출발이에요!':'다시 보면 기억나요!';$('#resultText').innerHTML=`10문제 중 <strong>${s.score}개</strong> 정답<br>최고 기록 ${localStorage.bestFlags}개`}
$('#nextFlag').onclick=nextFlag;$('#restartFlags').onclick=()=>{if(!flagState||flagState.i===0||confirm('퀴즈를 처음부터 다시 시작할까요?'))startFlags()};$('#againFlags').onclick=startFlags;
})();
</script>
</body></html>
